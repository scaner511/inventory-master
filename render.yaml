# ============================================================
# Render Blueprint — Inventory Master OS Web
# Despliega la API (FastAPI) y su base de datos PostgreSQL.
#
# Para usar: conecta el repo en Render Dashboard →
# "Blueprint" → elige este repositorio. Se crean automáticamente
# el Web Service y la base de datos con estos valores.
# ============================================================

databases:
  - name: inventory-master-db
    databaseName: inventory
    user: inventory
    plan: free
    region: oregon

services:
  - type: web
    name: inventory-master-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: SECRET_KEY
        generateValue: true
        # IMPORTANTE: usa un ADMIN_PASSWORD fuerte en producción y define el
        # dominio del frontend en CORS_ORIGINS. En el Dashboard de Render:
        #   ADMIN_PASSWORD=tu-contraseña-admin
        #   CORS_ORIGINS=https://TU-FRONTEND.vercel.app
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPERADMIN_USERNAME
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Google Drive OAuth (botón "Conectar con Google Drive" en el panel).
      # Crea el Cliente OAuth una vez en Google Cloud Console y define aquí:
      #   - key: GOOGLE_OAUTH_CLIENT_ID
      #     sync: false
      #   - key: GOOGLE_OAUTH_CLIENT_SECRET
      #     sync: false
      #   - key: PUBLIC_BASE_URL
      #     value: "https://inventory-master-api.onrender.com"
      # Subida automática de backups a Drive:
      #   - key: GOOGLE_DRIVE_AUTO_UPLOAD
      #     value: "true"

# IMPORTANTE: la variable DATABASE_URL la inyecta Render automáticamente cuando
# el Web Service está conectado a la base de datos de este Blueprint. Si NO está
# conectada, la app AHORA FALLA al arrancar en Render (no usa SQLite en disco
# efímero). Verifica en Dashboard → servicio → Connect que la base
# inventory-master-db esté conectada y que DATABASE_URL exista en Environment.

# Nota: el filesystem de Render free es EFÍMERO. El logo subido desde el panel
# (/uploads) y los backups automáticos se pierden al reiniciar/re-desplegar.
# Para producción real usa almacenamiento externo (Cloudinary / S3 / R2) y
# consulta DEPLOY.md para más detalles.
