<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1220">
<title>Generador de Licencias</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    background: #0b1220;
    color: #e2e8f0;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 480px; padding: 20px 18px 40px; }
  h1 { font-size: 22px; text-align: center; margin-top: 14px; color: #ffffff; }
  .sub { font-family: Consolas, monospace; font-size: 12px; color: #94a3b8; text-align: center; margin: 6px 0 24px; }
  label { display: block; font-size: 14px; color: #cbd5e1; margin-bottom: 6px; }
  input[type=text], input[type=number], input[type=password] {
    width: 100%;
    background: #111a2e;
    border: 1px solid #253352;
    border-radius: 10px;
    color: #f8fafc;
    font-family: Consolas, monospace;
    font-size: 16px;
    padding: 13px 12px;
    outline: none;
  }
  input:focus { border-color: #3b82f6; }
  input::placeholder { color: #475569; }
  .field { margin-bottom: 16px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row input[type=number] { flex: 1; }
  .expiry-info { font-family: Consolas, monospace; font-size: 13px; color: #94a3b8; margin: -8px 0 16px; padding-left: 2px; }
  button {
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    min-height: 48px;
    cursor: pointer;
    transition: filter .15s;
  }
  button:active { filter: brightness(1.25); }
  .btn-primary {
    width: 100%;
    background: #2563eb;
    color: #fff;
    font-size: 17px;
    margin-bottom: 16px;
  }
  .btn-secondary {
    flex: 1;
    background: #1e293b;
    color: #cbd5e1;
  }
  .result-box {
    background: #111a2e;
    border: 1px solid #253352;
    border-radius: 10px;
    padding: 12px;
    font-family: Consolas, monospace;
    font-size: 13px;
    word-break: break-all;
    color: #7dd3fc;
    min-height: 58px;
    margin-bottom: 12px;
    user-select: all;
    -webkit-user-select: all;
  }
  .status { text-align: center; font-size: 13px; min-height: 18px; margin: 10px 0 4px; color: #f59e0b; }
  .status.ok { color: #10b981; }
  .status.err { color: #ef4444; }
  details.adv { margin-top: 26px; border-top: 1px solid #1e293b; padding-top: 14px; }
  details.hist { margin-top: 14px; border-top: 1px solid #1e293b; padding-top: 14px; }
  summary { font-size: 14px; color: #94a3b8; cursor: pointer; padding: 6px 0; }
  .hist-item {
    background: #111a2e;
    border: 1px solid #253352;
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 8px;
    font-family: Consolas, monospace;
    font-size: 11px;
    color: #94a3b8;
    word-break: break-all;
  }
  .hist-item b { color: #e2e8f0; font-weight: 600; }
  .hist-item .k { color: #7dd3fc; display: block; margin-top: 4px; }
  .btn-danger {
    width: 100%;
    background: transparent;
    border: 1px solid #7f1d1d;
    color: #f87171;
    min-height: 38px;
    font-size: 13px;
    margin-top: 12px;
  }
  .hint { font-size: 12px; color: #64748b; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Generador de Licencias</h1>
  <div class="sub">Inventory Master &middot; offline &middot; HMAC-SHA256</div>

  <div class="field">
    <label for="code">C&oacute;digo de activaci&oacute;n del equipo</label>
    <input type="text" id="code" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false">
  </div>

  <div class="field">
    <label for="days">D&iacute;as de vigencia</label>
    <div class="row">
      <input type="number" id="days" value="30" min="1" max="3650" inputmode="numeric">
      <button class="btn-secondary" style="flex:0 0 auto;padding:0 16px;" id="btn30">30 d</button>
      <button class="btn-secondary" style="flex:0 0 auto;padding:0 16px;" id="btn365">365 d</button>
    </div>
  </div>
  <div class="expiry-info" id="expiryInfo"></div>

  <button class="btn-primary" id="btnGen">Generar licencia</button>

  <div class="result-box" id="result">—</div>
  <div class="row">
    <button class="btn-secondary" id="btnCopy">Copiar</button>
    <button class="btn-secondary" id="btnShare" style="display:none;">Compartir</button>
  </div>
  <div class="status" id="status"></div>

  <details class="hist">
    <summary>Historial (<span id="histCount">0</span>)</summary>
    <div id="histList"></div>
    <button class="btn-danger" id="btnClearHist">Borrar historial</button>
  </details>

  <details class="adv">
    <summary>Clave secreta personalizada (avanzado)</summary>
    <p class="hint">D&eacute;jalo vac&iacute;o para usar la clave incluida (misma que el programa). Equivale a la variable LICENSE_SECRET_KEY.</p>
    <div class="field" style="margin-top:10px;">
      <input type="password" id="secret" placeholder="LICENSE_SECRET_KEY" autocomplete="off">
    </div>
    <div class="row">
      <button class="btn-secondary" id="btnSaveSecret">Guardar</button>
      <button class="btn-secondary" id="btnClearSecret">Usar clave por defecto</button>
    </div>
  </details>
</div>

<script>
'use strict';
var DEFAULT_SECRET = '6c5ab6f076be4a57a76a81c1dfc19000a6dd493b054f91b3520dc8206919fcf8';

/* ===== SHA-256 puro (respaldo si crypto.subtle no está disponible) ===== */
var K = [
  0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
];

function sha256Bytes(bytes) {
  var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var l = bytes.length, bitLen = l * 8;
  var totalLen = Math.ceil((l + 9) / 64) * 64;
  var msg = new Uint8Array(totalLen);
  msg.set(bytes);
  msg[l] = 0x80;
  new DataView(msg.buffer).setUint32(totalLen - 4, bitLen >>> 0, false);
  var w = new Uint32Array(64);
  function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }
  for (var i = 0; i < totalLen; i += 64) {
    var dv = new DataView(msg.buffer);
    for (var t0 = 0; t0 < 16; t0++) w[t0] = dv.getUint32(i + t0 * 4, false);
    for (var t = 16; t < 64; t++) {
      var x15 = w[t-15], x2 = w[t-2];
      var s0 = rotr(x15,7) ^ rotr(x15,18) ^ (x15 >>> 3);
      var s1 = rotr(x2,17) ^ rotr(x2,19) ^ (x2 >>> 10);
      w[t] = (w[t-16] + s0 + w[t-7] + s1) >>> 0;
    }
    var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for (var t2 = 0; t2 < 64; t2++) {
      var S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25);
      var ch = (e & f) ^ (~e & g);
      var temp1 = (h + S1 + ch + K[t2] + w[t2]) >>> 0;
      var S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22);
      var maj = (a & b) ^ (a & c) ^ (b & c);
      var temp2 = (S0 + maj) >>> 0;
      h=g; g=f; f=e; e=(d+temp1)>>>0; d=c; c=b; b=a; a=(temp1+temp2)>>>0;
    }
    H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
  }
  var out = new Uint8Array(32), odv = new DataView(out.buffer);
  for (var j = 0; j < 8; j++) odv.setUint32(j*4, H[j], false);
  return out;
}

function concatBytes(a, b) {
  var r = new Uint8Array(a.length + b.length);
  r.set(a); r.set(b, a.length);
  return r;
}

function hmacSha256Bytes(keyBytes, msgBytes) {
  var key = keyBytes.length > 64 ? sha256Bytes(keyBytes) : keyBytes;
  var k = new Uint8Array(64); k.set(key);
  var oKey = new Uint8Array(64), iKey = new Uint8Array(64);
  for (var i = 0; i < 64; i++) { oKey[i] = k[i] ^ 0x5c; iKey[i] = k[i] ^ 0x36; }
  return sha256Bytes(concatBytes(oKey, sha256Bytes(concatBytes(iKey, msgBytes))));
}

function b64url(bytes) {
  var bin = '';
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function utf8(str) { return new TextEncoder().encode(str); }

function hmacB64url(secret, payload) {
  var kb = utf8(secret), mb = utf8(payload);
  if (window.crypto && window.crypto.subtle && window.isSecureContext !== false) {
    return window.crypto.subtle.importKey('raw', kb, {name:'HMAC', hash:'SHA-256'}, false, ['sign'])
      .then(function(key) { return window.crypto.subtle.sign('HMAC', key, mb); })
      .then(function(sig) { return b64url(new Uint8Array(sig)); })
      .catch(function() { return b64url(hmacSha256Bytes(kb, mb)); });
  }
  return Promise.resolve(b64url(hmacSha256Bytes(kb, mb)));
}

/* ===== Utilidades ===== */
function todayLocalISO(offsetDays) {
  var d = new Date();
  d.setDate(d.getDate() + (offsetDays || 0));
  var p = function(n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}

function getSecret() {
  return localStorage.getItem('licgen_secret') || DEFAULT_SECRET;
}

function generateLicense(code, expiry) {
  code = code.trim().toUpperCase().replace(/ /g, '');
  var payload = code + '|' + expiry.trim();
  var payloadB64 = b64url(utf8(payload));
  return hmacB64url(getSecret(), payload).then(function(sig) {
    return 'LIC.' + payloadB64 + '.' + sig;
  });
}

function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(t).then(function(){ return true; }).catch(function(){ return legacyCopy(t); });
  }
  return Promise.resolve(legacyCopy(t));
}
function legacyCopy(t) {
  var ta = document.createElement('textarea');
  ta.value = t;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  return ok;
}

/* ===== UI ===== */
var $ = function(id) { return document.getElementById(id); };
var elCode = $('code'), elDays = $('days'), elExpiry = $('expiryInfo'),
    elResult = $('result'), elStatus = $('status');

function setStatus(msg, cls) {
  elStatus.textContent = msg;
  elStatus.className = 'status' + (cls ? ' ' + cls : '');
}

function updateExpiry() {
  var days = parseInt(elDays.value, 10);
  if (!days || days < 1) { elExpiry.textContent = ''; return; }
  elExpiry.textContent = 'Vence el: ' + todayLocalISO(days);
}

function addToHistory(key, code, days, expiry) {
  var hist = [];
  try { hist = JSON.parse(localStorage.getItem('licgen_history') || '[]'); } catch (e) {}
  hist.unshift({ key: key, code: code, days: days, expiry: expiry, ts: Date.now() });
  hist = hist.slice(0, 20);
  localStorage.setItem('licgen_history', JSON.stringify(hist));
  renderHistory();
}

function renderHistory() {
  var hist = [];
  try { hist = JSON.parse(localStorage.getItem('licgen_history') || '[]'); } catch (e) {}
  $('histCount').textContent = hist.length;
  var list = $('histList');
  list.innerHTML = '';
  hist.forEach(function(item) {
    var div = document.createElement('div');
    div.className = 'hist-item';
    var info = document.createElement('span');
    var d = new Date(item.ts);
    info.innerHTML = '<b>' + item.code.replace(/</g,'&lt;') + '</b> · ' + item.days + ' días · vence ' + item.expiry;
    var k = document.createElement('span');
    k.className = 'k';
    k.textContent = item.key;
    div.appendChild(info);
    div.appendChild(k);
    div.addEventListener('click', function() {
      copyText(item.key).then(function(ok) {
        setStatus(ok ? 'Licencia copiada al portapapeles' : 'No se pudo copiar', ok ? 'ok' : 'err');
      });
    });
    list.appendChild(div);
  });
}

$('btn30').addEventListener('click', function() { elDays.value = 30; updateExpiry(); });
$('btn365').addEventListener('click', function() { elDays.value = 365; updateExpiry(); });
elDays.addEventListener('input', updateExpiry);

elCode.addEventListener('input', function() {
  var pos = elCode.selectionStart;
  elCode.value = elCode.value.toUpperCase();
  try { elCode.setSelectionRange(pos, pos); } catch (e) {}
});

$('btnGen').addEventListener('click', function() {
  var code = elCode.value.trim();
  var days = parseInt(elDays.value, 10);
  if (!code) { setStatus('Pega o escribe el código de activación del equipo cliente', 'err'); return; }
  if (!days || days < 1) { setStatus('Días de vigencia inválidos', 'err'); return; }
  if (!/^[0-9A-F]{4}(-[0-9A-F]{4}){3}$/.test(code)) {
    setStatus('Aviso: el código no parece tener formato XXXX-XXXX-XXXX-XXXX', '');
  }
  var expiry = todayLocalISO(days);
  generateLicense(code, expiry).then(function(key) {
    elResult.textContent = key;
    setStatus('Válida ' + days + ' días · hasta ' + expiry, 'ok');
    addToHistory(key, code.toUpperCase().replace(/ /g, ''), days, expiry);
  }).catch(function() {
    setStatus('Error generando la licencia', 'err');
  });
});

$('btnCopy').addEventListener('click', function() {
  var key = elResult.textContent;
  if (!key || key === '—') { setStatus('Primero genera una licencia', 'err'); return; }
  copyText(key).then(function(ok) {
    setStatus(ok ? 'Copiada al portapapeles' : 'No se pudo copiar automáticamente; mantén pulsado para seleccionar', ok ? 'ok' : 'err');
  });
});

if (navigator.share) {
  $('btnShare').style.display = '';
  $('btnShare').addEventListener('click', function() {
    var key = elResult.textContent;
    if (!key || key === '—') { setStatus('Primero genera una licencia', 'err'); return; }
    navigator.share({ title: 'Licencia Inventory Master', text: key }).catch(function() {});
  });
}

$('btnClearHist').addEventListener('click', function() {
  localStorage.removeItem('licgen_history');
  renderHistory();
  setStatus('Historial borrado', 'ok');
});

$('btnSaveSecret').addEventListener('click', function() {
  var s = $('secret').value.trim();
  if (s) {
    localStorage.setItem('licgen_secret', s);
    setStatus('Clave personalizada guardada', 'ok');
  } else {
    localStorage.removeItem('licgen_secret');
    setStatus('Usando clave por defecto', 'ok');
  }
});
$('btnClearSecret').addEventListener('click', function() {
  $('secret').value = '';
  localStorage.removeItem('licgen_secret');
  setStatus('Usando clave por defecto', 'ok');
});

updateExpiry();
renderHistory();
</script>
</body>
</html>
