  <text x="72" y="38" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#ffffff">Inventory</text>
  <text x="72" y="57" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#7dd3fc" letter-spacing="0.5">MASTER OS</text>
